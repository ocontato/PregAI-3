<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#050c18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Golden Ray Halo -->
  <circle cx="256" cy="240" r="140" fill="url(#goldGrad)" opacity="0.08" filter="url(#glow)"/>

  <!-- Open Bible Graphic -->
  <g transform="translate(106, 136)" filter="url(#glow)">
    <!-- Left Page -->
    <path d="M150 200 C 100 180, 40 185, 10 200 L 10 30 C 40 15, 100 10, 150 30 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Right Page -->
    <path d="M150 200 C 200 180, 260 185, 290 200 L 290 30 C 260 15, 200 10, 150 30 Z" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Spine and shadow -->
    <path d="M148 20 L152 20 L152 205 L148 205 Z" fill="#b45309"/>
    
    <!-- Left text lines -->
    <line x1="30" y1="60" x2="130" y2="55" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="85" x2="130" y2="80" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="110" x2="130" y2="105" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="135" x2="110" y2="130" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

    <!-- Right text lines -->
    <line x1="170" y1="55" x2="270" y2="60" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="80" x2="270" y2="85" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="105" x2="270" y2="110" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="130" x2="250" y2="135" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

    <!-- Bookmark ribbon -->
    <path d="M150 15 L 150 160 L 160 145 L 170 160 L 170 15 Z" fill="url(#goldGrad)"/>

    <!-- Golden Cross symbol in center -->
    <path d="M145 -10 L155 -10 L155 10 L145 10 Z" fill="url(#goldGrad)"/>
    <path d="M138 -3 L162 -3 L162 3 L138 3 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography at bottom -->
  <text x="256" y="420" font-family="'Georgia', serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    Preg<tspan fill="#f59e0b">AI</tspan>
  </text>
  <text x="256" y="452" font-family="sans-serif" font-size="14" font-weight="600" fill="#fde68a" text-anchor="middle" letter-spacing="4">
    SERMÕES TOP &bull; GOSPEL
  </text>
</svg>
